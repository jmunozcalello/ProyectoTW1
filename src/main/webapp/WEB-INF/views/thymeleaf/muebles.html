<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Muebles')}"></head>

<body>
  <nav th:replace="~{fragments/layout :: navbar('ambientes')}"></nav>

  <main class="container">
    <header class="hb-page-header">
      <div>
        <span class="hb-eyebrow">Inventario</span>
        <h1>Muebles</h1>
        <p>Muebles pertenecientes al ambiente.</p>
      </div>
      <a th:href="@{/muebles/crear}" class="btn btn-lg btn-primary"><i class="bi bi-plus-lg"></i> Agregar mueble</a>
    </header>

    <div class="card">
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead>
            <tr>
              <th scope="col" class="ps-4">Mueble</th>
              <th scope="col">Medidas</th>
              <th scope="col" class="text-end pe-4"><span class="visually-hidden">Acciones</span></th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="ps-4 fw-semibold">Cama</td>
              <td><span class="hb-chip">200cm x 160cm</span></td>
              <td class="text-end pe-4"><a th:href="@{/mueble/1}" class="btn btn-sm btn-secondary">Detalle</a></td>
            </tr>
            <tr>
              <td class="ps-4 fw-semibold">Escritorio</td>
              <td><span class="hb-chip">120cm x 60cm</span></td>
              <td class="text-end pe-4"><a th:href="@{/mueble/2}" class="btn btn-sm btn-secondary">Detalle</a></td>
            </tr>
            <tr>
              <td class="ps-4 fw-semibold">Placard</td>
              <td><span class="hb-chip">200cm x 60cm</span></td>
              <td class="text-end pe-4"><a th:href="@{/mueble/3}" class="btn btn-sm btn-secondary">Detalle</a></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <a th:href="@{/ambientes/1}" class="btn btn-secondary mt-4"><i class="bi bi-arrow-left"></i> Volver al ambiente</a>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
