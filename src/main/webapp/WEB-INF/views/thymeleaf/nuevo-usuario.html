<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Crear cuenta')}"></head>

<body>
  <nav th:replace="~{fragments/layout :: navbar('publico')}"></nav>

  <main class="hb-auth">
    <div class="card">
      <div class="card-body p-4 p-md-5">
        <form action="#" th:action="@{/registrarme}" method="POST" th:object="${usuario}">
          <span class="hb-eyebrow">Empezá gratis</span>
          <h1 class="h3 mb-4">Creá tu cuenta</h1>

          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input th:field="*{email}" id="email" type="email" class="form-control" placeholder="tu@email.com"
              required />
          </div>
          <div class="mb-4">
            <label for="password" class="form-label">Contraseña</label>
            <input th:field="*{password}" type="password" id="password" class="form-control" required />
          </div>

          <button id="btn-registrarme" class="btn btn-lg btn-primary w-100" type="submit">Registrarme</button>

          <p th:if="${error != null}" class="alert alert-danger mt-3 mb-0" th:text="'Error ' + ${error}"></p>
        </form>

        <p class="text-center text-secondary mt-4 mb-0">
          ¿Ya tenés cuenta? <a th:href="@{/login}">Ingresar</a>
        </p>
      </div>
    </div>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
