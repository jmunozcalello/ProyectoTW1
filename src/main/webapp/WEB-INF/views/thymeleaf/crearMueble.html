<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Agregar mueble')}"></head>

<body>
  <nav th:replace="~{fragments/layout :: navbar('ambientes')}"></nav>

  <main class="container">
    <header class="hb-page-header">
      <div>
        <span class="hb-eyebrow">Inventario</span>
        <h1>Agregar mueble</h1>
        <p>Acá se podrá agregar un nuevo mueble al ambiente.</p>
      </div>
    </header>

    <div class="card">
      <div class="card-body p-4">
        <form>
          <div class="row g-3">
            <div class="col-md-6">
              <label for="nombre" class="form-label">Nombre</label>
              <input type="text" id="nombre" name="nombre" class="form-control" placeholder="Ej: Sillón del living">
            </div>
            <div class="col-md-6">
              <label for="tipo" class="form-label">Tipo</label>
              <select id="tipo" name="tipo" class="form-select">
                <option>Cama</option>
                <option>Escritorio</option>
                <option>Sillón</option>
                <option>Mesa</option>
                <option>Placard</option>
                <option>Otro</option>
              </select>
            </div>
            <div class="col-md-4">
              <label for="ancho" class="form-label">Ancho (cm)</label>
              <input type="number" id="ancho" name="ancho" class="form-control">
            </div>
            <div class="col-md-4">
              <label for="profundidad" class="form-label">Profundidad (cm)</label>
              <input type="number" id="profundidad" name="profundidad" class="form-control">
            </div>
            <div class="col-md-4">
              <label for="alto" class="form-label">Alto (cm)</label>
              <input type="number" id="alto" name="alto" class="form-control">
            </div>
          </div>

          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary">Crear</button>
            <a th:href="@{/muebles}" class="btn btn-secondary">Volver</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
