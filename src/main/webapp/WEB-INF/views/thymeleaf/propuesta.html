<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Propuesta')}"></head>

<body>
  <nav th:replace="~{fragments/layout :: navbar('ambientes')}"></nav>

  <main class="container">
    <header class="hb-page-header">
      <div>
        <span class="hb-eyebrow">Propuesta</span>
        <h1>Propuesta Minimalista</h1>
        <p>Detalle de la propuesta generada.</p>
      </div>
      <span class="hb-chip hb-chip-primario fs-6"><i class="bi bi-cash-coin"></i> Costo estimado: $75.000</span>
    </header>

    <div class="card">
      <div class="card-body">
        <h2 class="h5 mb-3">Recomendaciones</h2>
        <ul class="list-unstyled mb-0 d-grid gap-2">
          <li><i class="bi bi-arrows-move text-primary me-2"></i>Se recomienda mover el sillón para mejorar la
            circulación.</li>
          <li><i class="bi bi-lamp text-primary me-2"></i>Se recomienda agregar una lámpara.</li>
        </ul>
      </div>
    </div>

    <div class="d-flex flex-wrap gap-2 mt-4">
      <button class="btn btn-primary"><i class="bi bi-check-lg"></i> Aplicar propuesta</button>
      <button class="btn btn-secondary">Rechazar</button>
      <a th:href="@{/ambientes/1}" class="btn btn-link ms-auto"><i class="bi bi-arrow-left"></i> Volver al ambiente</a>
    </div>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
