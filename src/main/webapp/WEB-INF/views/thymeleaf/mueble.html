<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Cama')}"></head>

<body>
  <nav th:replace="~{fragments/layout :: navbar('ambientes')}"></nav>

  <main class="container">
    <header class="hb-page-header">
      <div>
        <span class="hb-eyebrow">Mueble</span>
        <h1>Cama</h1>
        <p>Detalle del mueble.</p>
      </div>
    </header>

    <div class="card">
      <div class="card-body">
        <dl class="hb-datos">
          <dt>Tipo</dt>
          <dd>Cama</dd>
          <dt>Ancho</dt>
          <dd>160cm</dd>
          <dt>Profundidad</dt>
          <dd>200cm</dd>
          <dt>Alto</dt>
          <dd>50cm</dd>
        </dl>
      </div>
    </div>

    <a th:href="@{/muebles}" class="btn btn-secondary mt-4"><i class="bi bi-arrow-left"></i> Volver</a>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
