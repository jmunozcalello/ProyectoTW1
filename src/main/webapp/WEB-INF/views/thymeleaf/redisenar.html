<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Rediseñar ambiente')}"></head>

<body>
  <nav th:replace="~{fragments/layout :: navbar('ambientes')}"></nav>

  <main class="container">
    <header class="hb-page-header">
      <div>
        <span class="hb-eyebrow">Rediseño</span>
        <h1>Rediseñar ambiente</h1>
        <p>Configurá qué tipo de diseño querés y el sistema generará propuestas.</p>
      </div>
    </header>

    <div class="card">
      <div class="card-body p-4">
        <form>
          <div class="row g-3">
            <div class="col-md-4">
              <label for="estilo" class="form-label">Estilo</label>
              <select id="estilo" name="estilo" class="form-select">
                <option>Minimalista</option>
                <option>Industrial</option>
                <option>Retro</option>
                <option>Boho</option>
                <option>Japandi</option>
                <option>Escandinavo</option>
              </select>
            </div>
            <div class="col-md-4">
              <label for="presupuesto" class="form-label">Presupuesto</label>
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input type="number" id="presupuesto" name="presupuesto" class="form-control" placeholder="0">
              </div>
            </div>
            <div class="col-md-4">
              <label for="prioridad" class="form-label">Prioridad</label>
              <select id="prioridad" name="prioridad" class="form-select">
                <option>Espacio libre</option>
                <option>Comodidad</option>
                <option>Estética</option>
                <option>Funcionalidad</option>
              </select>
            </div>
          </div>

          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary"><i class="bi bi-magic"></i> Generar propuestas</button>
            <a th:href="@{/ambientes/1}" class="btn btn-secondary">Volver</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
