<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <title>Taller Web I</title>

  <!-- Boostrap core css -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

  <!-- custom style -->
  <link rel="stylesheet" th:href="@{/css/main.css}" />

</head>

<body>

  <nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
    <a class="navbar-brand" href="#">UNLAM</a>
  </nav>

<main role="main" class="container">
    <div class="container">

        <h1>Rediseñar Ambiente</h1>

        <p>
            Configurá qué tipo de diseño querés y el sistema
            generará propuestas.
        </p>

        <form>

            <div>
                <h3>Estilo</h3>

                <select name="estilo">
                    <option>Minimalista</option>
                    <option>Industrial</option>
                    <option>Retro</option>
                    <option>Boho</option>
                    <option>Japandi</option>
                    <option>Escandinavo</option>
                </select>
            </div>

            <div>
                <h3>Presupuesto</h3>

                <input type="number"
                       name="presupuesto"
                       placeholder="$">

            </div>

            <div>
                <h3>Prioridad</h3>

                <select name="prioridad">
                    <option>Espacio libre</option>
                    <option>Comodidad</option>
                    <option>Estética</option>
                    <option>Funcionalidad</option>
                </select>

            </div>

            <br>

            <button type="submit"
                    class="btn btn-primary">
                Generar propuestas
            </button>

        </form>

        <br>

        <a th:href="@{/ambientes/1}"
           class="btn btn-secondary">
            Volver
        </a>

    </div>
</main>
  <!-- /.container -->

  <!-- Boostrap core js -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous"></script>

</body>

</html>
