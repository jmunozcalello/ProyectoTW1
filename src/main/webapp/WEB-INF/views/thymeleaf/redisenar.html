<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Rediseñar ambiente')}"></head>

<body>
  <nav th:replace="~{fragments/layout :: navbar('ambientes')}"></nav>

  <main class="container">
    <header class="hb-page-header">
      <div>
        <span class="hb-eyebrow">Rediseño</span>
        <h1>Rediseñar ambiente</h1>
        <p>Configurá qué tipo de diseño querés y el sistema generará propuestas.</p>
      </div>
    </header>

    <div class="card">
      <div class="card-body p-4">
        <form th:action="@{/muebles/redisenar}" method="post">
          <div class="row g-3">
            <div class="col-md-6">
              <label for="estilo" class="form-label">Estilo</label>
              <select id="estilo" name="estilo" class="form-select">
                <option th:each="estilo : ${estilos}" th:value="${estilo.name()}" th:text="${estilo}">Minimalista</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="presupuesto" class="form-label">Presupuesto</label>
              <div class="input-group">
                <span class="input-group-text">$</span>
                <input type="number" id="presupuesto" name="presupuesto" class="form-control" min="0" placeholder="0" required>
              </div>
            </div>
            <div class="col-md-6">
              <label for="tipoDeAmbiente" class="form-label">Tipo de ambiente</label>
              <select id="tipoDeAmbiente" name="tipoDeAmbiente" class="form-select">
                <option value="">Todos</option>
                <option value="Living">Living</option>
                <option value="Habitación">Habitación</option>
                <option value="Pasillo">Pasillo</option>
                <option value="Cocina">Cocina</option>
                <option value="Comedor">Comedor</option>
              </select>
            </div>
          </div>

          <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary"><i class="bi bi-magic"></i> Generar propuestas</button>
            <a th:href="@{/ambientes/1}" class="btn btn-secondary">Volver</a>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
