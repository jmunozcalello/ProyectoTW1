<!DOCTYPE HTML>
<!--
  Habitat — fragmentos compartidos por todas las vistas.

  Uso en una vista:
    <head th:replace="~{fragments/layout :: head('Mis ambientes')}"></head>
    <nav th:replace="~{fragments/layout :: navbar('ambientes')}"></nav>
    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <th:block th:replace="~{fragments/layout :: scripts}"></th:block>

  navbar(seccion): 'publico' muestra Ingresar / Registrarme;
                   'inicio' o 'ambientes' muestra la navegación privada y marca la sección activa.
-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(titulo)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title th:text="${titulo} + ' · Habitat'">Habitat</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" th:href="@{/css/tokens.css}" />
  <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>

<body>

  <nav th:fragment="navbar(seccion)" class="navbar navbar-expand-md sticky-top">
    <div class="container">
      <a class="navbar-brand" th:href="${seccion == 'publico'} ? @{/} : @{/home}">
        <svg class="hb-logo" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M4 14.5 16 5l12 9.5V27a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V14.5Z" stroke="currentColor" stroke-width="2.2"
            stroke-linejoin="round" />
          <rect x="12" y="16" width="8" height="12" rx="1" fill="currentColor" />
        </svg>Habitat</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#hb-navbar"
        aria-controls="hb-navbar" aria-expanded="false" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="hb-navbar">
        <ul class="navbar-nav ms-auto align-items-md-center gap-md-2" th:if="${seccion == 'publico'}">
          <li class="nav-item"><a class="nav-link" th:href="@{/login}">Ingresar</a></li>
          <li class="nav-item"><a class="btn btn-primary" th:href="@{/nuevo-usuario}">Registrarme</a></li>
        </ul>
        <ul class="navbar-nav ms-auto align-items-md-center gap-md-2" th:unless="${seccion == 'publico'}">
          <li class="nav-item">
            <a class="nav-link" th:classappend="${seccion == 'inicio'} ? 'active'" th:href="@{/home}">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" th:classappend="${seccion == 'ambientes'} ? 'active'" th:href="@{/ambientes}">Mis
              ambientes</a>
          </li>
          <li class="nav-item">
            <a class="btn btn-primary" th:href="@{/plano/ambiente}"><i class="bi bi-plus-lg"></i> Nuevo ambiente</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <footer th:fragment="footer" class="hb-footer">
    <div class="container d-flex flex-wrap justify-content-between gap-2">
      <span>Habitat · Diseñá espacios que se viven mejor</span>
      <span>Taller Web I · UNLaM</span>
    </div>
  </footer>

  <th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"></script>
  </th:block>

</body>

</html>
