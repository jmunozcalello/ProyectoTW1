<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Mis ambientes')}"></head>

<body>
  <nav th:replace="~{fragments/layout :: navbar('ambientes')}"></nav>

  <main class="container">
    <header class="hb-page-header">
      <div>
        <h1>Mis ambientes</h1>
        <p>Acá podés ver y administrar tus ambientes.</p>
      </div>
      <a th:href="@{/plano/ambiente}" class="btn btn-lg btn-primary"><i class="bi bi-plus-lg"></i> Crear ambiente</a>
    </header>

    <div th:if="${#lists.isEmpty(ambientes)}" class="alert alert-info">
      <i class="bi bi-house"></i>
      Todavía no tenés ambientes. Creá uno para empezar.
    </div>

    <div class="row g-4">
      <div th:each="ambiente : ${ambientes}" class="col-md-6 col-lg-4">
        <div class="card h-100 hb-card-hover">
          <div class="card-body">
            <h2 class="h5" th:text="${ambiente.tipoDeAmbiente.nombre}">Habitación</h2>
            <p>
              <span class="hb-chip">
                <i class="bi bi-rulers"></i>
                <span th:text="${#numbers.formatDecimal(ambiente.ancho, 1, 0) + 'm x ' + #numbers.formatDecimal(ambiente.largo, 1, 0) + 'm'}">4m x 3m</span>
              </span>
            </p>
            <ul th:if="${!#lists.isEmpty(ambiente.muebles)}" class="list-unstyled hb-lista-muebles">
              <li th:each="mueble : ${ambiente.muebles}">
                <i class="bi bi-diamond-fill"></i>
                <a th:href="@{/mueble/{id}(id=${mueble.id})}" th:text="${mueble.nombre}">Cama</a>
              </li>
            </ul>
            <p th:if="${#lists.isEmpty(ambiente.muebles)}" class="text-secondary">Sin muebles cargados todavía.</p>
            <a th:href="@{/ambientes/{id}(id=${ambiente.id})}" class="btn btn-primary">Ver ambiente</a>
          </div>
        </div>
      </div>
    </div>

    <a th:href="@{/home}" class="btn btn-secondary mt-4"><i class="bi bi-arrow-left"></i> Volver</a>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
