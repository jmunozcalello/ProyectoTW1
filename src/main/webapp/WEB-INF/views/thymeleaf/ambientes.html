<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Mis ambientes')}"></head>

<body>
  <nav th:replace="~{fragments/layout :: navbar('ambientes')}"></nav>

  <main class="container">
    <header class="hb-page-header">
      <div>
        <h1>Mis ambientes</h1>
        <p>Acá podés ver y administrar tus ambientes.</p>
      </div>
      <a th:href="@{/plano/ambiente}" class="btn btn-lg btn-primary"><i class="bi bi-plus-lg"></i> Crear ambiente</a>
    </header>

    <div class="row g-4">
      <div class="col-md-6 col-lg-4">
        <div class="card h-100 hb-card-hover">
          <div class="card-body">
            <h2 class="h5">Habitación</h2>
            <p><span class="hb-chip"><i class="bi bi-rulers"></i> 4m x 3m</span></p>
            <a th:href="@{/ambientes/1}" class="btn btn-primary">Ver ambiente</a>
          </div>
        </div>
      </div>
      <div class="col-md-6 col-lg-4">
        <div class="card h-100 hb-card-hover">
          <div class="card-body">
            <h2 class="h5">Cocina</h2>
            <p><span class="hb-chip"><i class="bi bi-rulers"></i> 5m x 3m</span></p>
            <a th:href="@{/ambientes/2}" class="btn btn-primary">Ver ambiente</a>
          </div>
        </div>
      </div>
    </div>

    <a th:href="@{/home}" class="btn btn-secondary mt-4"><i class="bi bi-arrow-left"></i> Volver</a>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
