<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

  <title>Taller Web I</title>

  <!-- Boostrap core css -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">

  <!-- custom style -->
  <link rel="stylesheet" th:href="@{/css/main.css}" />

</head>

<body>

  <nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
    <a class="navbar-brand" href="#">UNLAM</a>
  </nav>

<main role="main" class="container">
    <div class="container">

        <h1>Propuestas</h1>

        <p>
            Propuestas generadas para este ambiente.
        </p>

        <div>

            <h2>Propuesta económica</h2>

            <p>
                Reorganización de muebles existentes.
            </p>

            <p>
                Costo estimado: $0
            </p>

            <a th:href="@{/propuestas}"
               class="btn btn-primary">
                Ver propuesta
            </a>

        </div>

        <hr>

        <div>

            <h2>Propuesta completa</h2>

            <p>
                Reorganización y agregado de decoración.
            </p>

            <p>
                Costo estimado: $150.000
            </p>

            <a th:href="@{/propuestas}"
               class="btn btn-primary">
                Ver propuesta
            </a>

        </div>

        <br>

        <a th:href="@{/ambientes}"
           class="btn btn-secondary">
            Volver
        </a>

    </div>
</main>
  <!-- /.container -->

  <!-- Boostrap core js -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
    crossorigin="anonymous"></script>

</body>

</html>
