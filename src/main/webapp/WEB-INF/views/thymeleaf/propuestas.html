<!DOCTYPE HTML>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Propuestas')}"></head>

<body>
  <nav th:replace="~{fragments/layout :: navbar('ambientes')}"></nav>

  <main class="container">
    <header class="hb-page-header">
      <div>
        <span class="hb-eyebrow">Propuestas</span>
        <h1>Propuestas</h1>
        <p>Propuestas generadas para este ambiente.</p>
      </div>
    </header>

    <div class="row g-4">
      <div class="col-md-6">
        <div class="card h-100 hb-card-hover">
          <div class="card-body">
            <h2 class="h5">Propuesta económica</h2>
            <p class="text-secondary">Reorganización de muebles existentes.</p>
            <p><span class="hb-chip hb-chip-salvia"><i class="bi bi-cash-coin"></i> Costo estimado: $0</span></p>
            <a th:href="@{/propuestas/1}" class="btn btn-primary">Ver propuesta</a>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card h-100 hb-card-hover">
          <div class="card-body">
            <h2 class="h5">Propuesta completa</h2>
            <p class="text-secondary">Reorganización y agregado de decoración.</p>
            <p><span class="hb-chip hb-chip-primario"><i class="bi bi-cash-coin"></i> Costo estimado: $150.000</span></p>
            <a th:href="@{/propuestas/2}" class="btn btn-primary">Ver propuesta</a>
          </div>
        </div>
      </div>
    </div>

    <a th:href="@{/ambientes}" class="btn btn-secondary mt-4"><i class="bi bi-arrow-left"></i> Volver</a>
  </main>

  <footer th:replace="~{fragments/layout :: footer}"></footer>
  <th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>

</html>
